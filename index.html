<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="produtos">
        <div class="produto">
            <img class="produto__imagem" src="https://cdn.awsli.com.br/2500x2500/1714/1714539/produto/289387229/945b10f78b8850fa776d90ff1c0d6be9-up3xgpmon6.jpeg" alt="Tenis">
            <h4 class="produto__nome">Tênis Nike</h4>
            <p class="produto__descricao">
                Tênis Nike na Cor Preto e Branco, Super Confortavel
            </p>
        </div>
        <div class="produto produto--em-destaque">
            <img class="produto__imagem" src="https://m.media-amazon.com/images/I/518UdQCE1uL._SY1000_.jpg" alt="Camisa Polo Lacoste">
            <h4 class="produto__nome">Camisa Polo</h4>
            <p class="produto__descricao">
                Polo Lacoste, Material de Alta Qualidade, Produto Original
            </p>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://cyclone.vtexassets.com/arquivos/ids/252934-800-auto?v=638502686186770000&width=800&height=auto&aspect=true" alt="Bermuda Cyclone">
            <h4 class="produto__nome">Bermuda Veludo</h4>
            <p class="produto__descricao">
                Bermuda de Veludo da Cyclone, Material de Qualidade
            </p>
        </div>
    </div>
</body>
</html>
