<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Numeros</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>

<body>
    <main>
        <h1>Sorteador Oficial da EBAC</h1>
        <form id="form-sorteio">
            <div>
                <label for="numero-maximo">Numero Maximo</label>
                <input type="number" id="numero-maximo" name="numero-maximo" required min="2" step="1" placeholder="100">
            </div>
            <button type="submit">Sortear</button>
        </form>

        <div class="resultado">
            <h2>O numero sorteado foi:</h2> <span id="resultado-sorteio"></span>
        </div>

    </main>

    <script src="@@ENDERECO_DO_JS"></script>
</body>

</html>
